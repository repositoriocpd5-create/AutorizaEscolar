# Blueprint do Render: cria o serviço web em um clique.
# https://render.com/docs/blueprint-spec
#
# Banco: PostgreSQL do Supabase. Ao aplicar o blueprint, o Render pedirá o valor de
# DATABASE_URL — use a string "Session pooler" (porta 5432) de
# Supabase → Project Settings → Database → Connection string, com a senha do banco.
# (A conexão "Direct" do Supabase é somente IPv6 e não funciona no Render.)
services:
  - type: web
    name: autoriza-escolar
    runtime: python
    plan: free
    region: virginia
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: bash render-start.sh
    healthCheckPath: /saude
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false   # informado no painel do Render (não versionado)
      # Segredos gerados pelo Render (nunca versionados)
      - key: SECRET_KEY
        generateValue: true
      # Informado manualmente: deve ser o MESMO usado nas importações (alunos.sql)
      # e nunca mudar depois que houver responsáveis cadastrados.
      - key: CPF_PEPPER
        sync: false
      # HTTPS atrás do proxy do Render
      - key: PROXY_FIX
        value: "true"
      - key: FORCAR_HTTPS
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: INSTITUICAO_NOME
        value: Secretaria Municipal de Educação
      - key: AUTH_SEGUNDO_FATOR
        value: nenhum
      # Demonstração desligada (há dados reais). Para produção: considere AUTH_SEGUNDO_FATOR=data_nascimento.
      - key: DEMO_MODE
        value: "false"   # dados reais: sem CPF fictício, sem faixa de demonstração e sem seed
      # Painel administrativo: login pelo Supabase Authentication (sem senhas no sistema)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false   # opcional: criar/convidar/bloquear usuários pelo painel
      - key: ADMIN_EMAILS
        sync: false   # e-mails que viram administradores da rede no 1º login
